name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux archive (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: GTK 4 development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - run: cargo build --release --locked -p forzac-gtk
      - name: Archive
        run: |
          name="forzac-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}"
          scripts/package-linux.sh "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}

  deb:
    name: Raspberry Pi OS package (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      # Built in Debian 13, the base of Raspberry Pi OS 13, against its GTK and glibc.
      - name: Package
        run: |
          docker build -q -t forzac-debian -f ci/debian.Dockerfile ci
          docker run --rm -v "$PWD":/src -w /src -e CARGO_TARGET_DIR=/src/target forzac-debian bash -c \
            "cargo build --release --locked -p forzac-gtk && scripts/package-deb.sh ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-arm64
          path: forzac_*_arm64.deb

  macos:
    name: macOS disk image (arm64)
    runs-on: macos-15  # Xcode 16: the shell uses Swift 6 (@retroactive)
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: macos/build.sh
      - name: Disk image
        run: scripts/package-macos.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: Forzac-*-macos-arm64.dmg*

  release:
    name: Draft release
    needs: [linux, deb, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Names without the version, so the site can link releases/latest/download/<name> once and for all.
      - name: Stable names and checksums
        working-directory: dist
        run: |
          mv Forzac-*-macos-arm64.dmg Forzac-macos-arm64.dmg
          rm -f Forzac-*-macos-arm64.dmg.sha256
          for a in x86_64 aarch64; do mv forzac-*-linux-$a.tar.gz forzac-linux-$a.tar.gz; done
          mv forzac_*_arm64.deb forzac-linux-arm64.deb
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
