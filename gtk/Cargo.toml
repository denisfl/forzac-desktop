[package]
name = "forzac-gtk"
description = "Forzac for Linux: GTK 4 shell"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "forzac"
path = "src/main.rs"

[dependencies]
forzac-core = { path = "../core" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
pango = { version = "0.22.9", features = ["v1_42"] }
pangocairo = "0.22.9"
